<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Na Carta – планировщик</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--ink:#141414;--soft:#5f5f5c;--line:#e4e2dc;--marker:#ffd83d;--marker-ink:#141414;--tint:#f6f5f1;--tint2:#ecebe5;
--sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--hand:"Caveat",cursive;
--shadow:0 1px 2px rgba(20,20,20,.06),0 8px 28px rgba(20,20,20,.10);--mapbg:#e8e6e1;--tipbg:#141414;--tipink:#ffffff}
@media (prefers-color-scheme:dark){:root{--paper:#171715;--ink:#f2f1ec;--soft:#aaa9a1;--line:#2f2e2a;--tint:#201f1c;--tint2:#2a2926;--mapbg:#2a2d30;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);--tipbg:#f2f1ec;--tipink:#141414}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{flex:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);height:100vh;height:100dvh}
/* panel */
.side{position:relative;z-index:6;background:var(--paper);box-shadow:0 0 32px rgba(20,20,20,.10);display:flex;flex-direction:column;padding:10px 16px 14px;gap:9px;min-height:0;height:100%}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.logo{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--soft);letter-spacing:-.01em;white-space:nowrap}
.logo svg{background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:3px;width:20px;height:20px}

.user{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%}
.user:hover{background:var(--tint)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:600;font-size:11px}
.user b{display:block;font-weight:600;font-size:13px;line-height:1.15}
.user small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--soft);line-height:1.15}
.sdot{position:absolute;right:3px;bottom:3px;width:10px;height:10px;border-radius:50%;background:#2e9d5b;border:2px solid var(--paper)}
.user.busy .sdot{background:var(--marker);box-shadow:0 0 0 1px var(--ink)}
.title{width:100%;border:0;border-radius:10px;background:transparent;padding:6px 8px;margin:0 -8px;width:calc(100% + 16px);font:650 18px/1.2 var(--sans);letter-spacing:-.015em;color:var(--ink);text-overflow:ellipsis}
.title:hover{background:var(--tint)}.title:focus{background:var(--tint);outline:2px solid var(--ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--tint);border-radius:11px;padding:3px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:32px;padding:4px 2px;border-radius:8px;font-size:13px;white-space:nowrap}
.seg input:checked+span{background:var(--marker);color:var(--marker-ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:1px}
.seg label:hover input:not(:checked)+span{background:var(--tint2)}
.sum{display:grid;gap:8px}
.sum .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.sum .row2{display:flex;gap:16px}
.sum .big{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:-.04em;line-height:1}
.sum .big small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--soft);margin-left:3px}
.sum .st{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
.sum .st em{font-style:normal;color:var(--soft);font-size:12px;margin-right:2px}
.cov{display:flex;height:8px;gap:2px}
.cov i{display:block;height:100%;min-width:3px;border-radius:1px}
.covl{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:2px 6px;font-size:12px;color:var(--soft)}
.covl span{display:inline-flex;align-items:center;gap:3px}.covl b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:11.5px}
.fold{border-radius:12px;background:var(--tint)}
.fold>button.fh{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:6px 12px;text-align:left;border-radius:12px}
.fold>button.fh:hover{background:var(--tint2)}
.fold .fl{font-weight:600;font-size:13.5px;white-space:nowrap}
.fold .fs{flex:1;min-width:0;color:var(--soft);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold .chev{transition:transform .15s;color:var(--soft)}
.fold.open .chev{transform:rotate(180deg)}
.fold .fb{display:none;padding:2px 12px 12px}
.fold.open .fb{display:block}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 5px;font-size:12.5px;font-weight:500;color:var(--soft)}
.lbl output{font-family:var(--mono);color:var(--ink);font-weight:600;background:var(--marker);padding:0 6px;border-radius:4px}
.fb .seg{background:var(--tint2)}
.fb .seg label:hover input:not(:checked)+span{background:var(--line)}
input[type=range]{width:100%;accent-color:var(--ink);height:22px;margin:0}
.tl{display:flex;flex-direction:column;min-height:0;flex:1}
.tl h2{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--soft);display:flex;justify-content:space-between;align-items:baseline}
.tl h2 span{font-family:var(--hand);font-size:17px;font-weight:600;color:var(--soft);text-transform:none}
.evs{list-style:none;margin:0 -6px;padding:0 6px 0 0;overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
.ev{display:grid;grid-template-columns:14px 20px minmax(0,1fr) auto;align-items:center;gap:6px;width:100%;height:28px;padding:0 6px 0 2px;border-radius:8px;text-align:left}
.ev:hover,.ev.on{background:var(--tint)}
.ev.on .tx{font-weight:600}
.ev.pin{background:var(--marker);color:var(--marker-ink)}
.ev.pin .km{color:var(--marker-ink)}
.rail{align-self:stretch;justify-self:center;width:4px;background:var(--c,#999)}
.rail.flat{box-shadow:inset 0 0 0 1px #26262b}
.rail.s-compact{-webkit-mask:repeating-linear-gradient(180deg,#000 0 16px,transparent 16px 22px);mask:repeating-linear-gradient(180deg,#000 0 16px,transparent 16px 22px)}
.rail.s-gravel{-webkit-mask:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 14px);mask:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 14px)}
.rail.s-dirt{-webkit-mask:repeating-linear-gradient(180deg,#000 0 4px,transparent 4px 9px);mask:repeating-linear-gradient(180deg,#000 0 4px,transparent 4px 9px)}
.rail.s-trail{-webkit-mask:repeating-linear-gradient(180deg,#000 0 2px,transparent 2px 8px);mask:repeating-linear-gradient(180deg,#000 0 2px,transparent 2px 8px)}
.rail.s-straight{-webkit-mask:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 16px);mask:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 16px)}
.eico{display:grid;place-items:center;width:20px;height:20px;border-radius:50%}
.eico.start{background:#16a34a;color:#fff}.eico.end{background:#dc2626;color:#fff}
.eico.cp{background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;width:20px;height:20px}
.eico.climb,.eico.desc{font-weight:700;font-size:14px}
.ev .tx{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .km{font-family:var(--mono);font-size:11.5px;color:var(--soft)}
.acts{display:grid;gap:8px}
.garmin{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border-radius:12px;background:transparent;color:var(--ink);font-weight:600;font-size:14.5px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.garmin:hover{background:var(--tint)}.garmin:active{background:var(--tint2)}
.beta{font:600 10.5px/1 var(--mono);letter-spacing:.02em;padding:3px 6px;border-radius:999px;background:var(--tint2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sec3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:6px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border-radius:10px;background:var(--tint);font-weight:500;font-size:13px}.sbtn svg{display:none}
.sbtn:hover{background:var(--tint2)}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;padding:4px 2px 4px 4px;border-radius:8px}
.dot{width:10px;height:10px;border-radius:50%}
.item b{display:block;font-weight:600;font-size:13.5px;line-height:1.25}.item small{color:var(--soft);font-size:12px}
.eye{width:36px;height:36px;border-radius:8px;display:grid;place-items:center}.eye:hover{background:var(--tint2)}.eye[aria-pressed=false]{color:var(--soft)}
.eye[aria-pressed=false] .on-i{display:none}.eye[aria-pressed=true] .off-i{display:none}
.newr{margin-top:6px;width:100%;min-height:36px;border:1px dashed var(--soft);border-radius:10px;font-weight:600}
.newr:hover{background:var(--tint2)}
/* map */
.mapcol{position:relative;min-width:0;min-height:0;--prof-h:0px}
#map{position:absolute;inset:0}
.tbar{position:absolute;top:12px;left:12px;right:60px;z-index:4;display:flex;align-items:center;gap:2px;padding:4px;width:max-content;max-width:calc(100% - 72px);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-radius:14px;box-shadow:var(--shadow)}
.tb{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.tb:hover{background:var(--tint)}
.tb[aria-pressed=true],.tb[aria-expanded=true]{background:var(--marker);color:var(--marker-ink)}
.tb[aria-disabled=true]{opacity:.4;cursor:default}
.tsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.lpop{position:absolute;top:66px;left:12px;z-index:5;width:min(380px,calc(100% - 24px));max-height:calc(100% - 90px - var(--prof-h));overflow:auto;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 6px}
.lpop[hidden]{display:none}
.lyr-group{margin:0 0 12px}.lyr-group h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--soft)}
.lyr-items{display:flex;flex-wrap:wrap;gap:6px}
.lyr-item{position:relative}.lyr-item input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.lyr-item span{display:flex;align-items:center;min-height:32px;padding:6px 12px;border-radius:999px;background:var(--tint);font-size:13.5px}
.lyr-item input:checked+span{background:var(--marker);color:var(--marker-ink);font-weight:600}
.lyr-item input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.lyr-item:hover input:not(:checked)+span{background:var(--tint2)}
.maplibregl-ctrl-group{background:var(--paper)!important;border-radius:12px!important;box-shadow:var(--shadow)!important;border:0!important}
.maplibregl-ctrl-group button{width:40px!important;height:40px!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
@media (prefers-color-scheme:dark){.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--prof-h) + 12px)}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--prof-h) + 12px)}
.maplibregl-ctrl-attrib{font-size:11px;border-radius:6px 0 0 6px}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:8;background:var(--tipbg);color:var(--tipink);padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
/* profile */
.prof{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:8px 14px 10px}
.ph{display:flex;align-items:center;gap:10px;min-height:32px}
.ph h2{margin:0;font-size:13.5px;font-weight:650}
.ph .lim{flex:1;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .lim b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.pcol{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}.pcol:hover{background:var(--tint)}
.pcol svg{transition:transform .15s}.prof.shut .pcol svg{transform:rotate(180deg)}
.pbody{display:block}.prof.shut .pbody{display:none}
.cv-wrap{position:relative;height:150px}
.cv-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tip{position:absolute;top:26px;z-index:3;pointer-events:none;display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--tipbg);color:var(--tipink);font-size:12.5px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tip b,.tip span.m{font-family:var(--mono);font-weight:500}.tip[hidden]{display:none}
.leg{display:flex;flex-wrap:wrap;gap:3px 14px;padding-top:6px;font-size:12px;color:var(--soft);line-height:1.4}
.lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}.lg svg{color:var(--ink)}
.leg .sp{width:100%;height:0}
/* markers */
.nk-wp{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);color:#fff;font:700 13px/22px var(--sans);text-align:center;box-sizing:border-box;cursor:pointer}
.nk-wp-start{background:#16a34a}.nk-wp-end{background:#dc2626}.nk-wp-mid{background:#1f2937}
.nk-cp{width:30px;height:30px;border-radius:9px;background:#fff;color:#141414;border:2px solid #141414;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.nk-cp.sel{background:#ffd83d}
.nk-hover{width:16px;height:16px;border-radius:50%;background:#ffd83d;border:3px solid #141414;box-shadow:0 0 0 2px #fff,0 1px 5px rgba(0,0,0,.5);pointer-events:none}
/* tooltips, keycaps */
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--tint);border:1px solid var(--line);border-bottom-width:2px;color:var(--ink);font:500 11.5px/1 var(--mono)}
#kt{position:fixed;z-index:60;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:9px;background:var(--tipbg);color:var(--tipink);font-size:12.5px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
#kt[hidden]{display:none}
#kt kbd{background:rgba(128,128,128,.3);border-color:rgba(128,128,128,.45);color:inherit;height:19px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.35);display:grid;place-items:start center;padding-top:14vh}
.ov[hidden]{display:none}
.dlg{width:min(480px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--paper);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:8px}
.dlg h3{margin:10px 12px 8px;font-size:15px}
.dlg input.q{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px;font:500 16px var(--sans);color:var(--ink);outline:none;margin-bottom:4px}
.cmd{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:42px;padding:6px 12px;border-radius:10px;text-align:left;font-size:14px}
.cmd[aria-selected=true]{background:var(--marker);color:var(--marker-ink)}
.cmd[aria-selected=true] kbd{background:rgba(255,255,255,.6);color:#141414;border-color:rgba(0,0,0,.35)}
.cmd .ks{display:flex;gap:4px}
.help{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;padding:0 12px 12px}
.help div{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:38px;border-bottom:1px solid var(--line);font-size:13.5px}
.help .ks{display:flex;gap:4px}
.hand{font-family:var(--hand);font-size:17px;color:var(--soft);font-weight:600}
#profSlot{display:none}
@media (max-width:1100px){.app{grid-template-columns:280px minmax(0,1fr)}}
@media (hover:none){#kt{display:none!important}}
@media (max-width:639px){
 body{overflow:auto}
 .app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
 .mapcol{height:52dvh;min-height:320px;flex:none;--prof-h:0px!important}
 .side{height:auto;box-shadow:0 -6px 24px rgba(20,20,20,.14);border-radius:22px 22px 0 0;margin-top:-20px;padding:6px 16px 36px;order:2}
 .side::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
 .tl{flex:none}.evs{overflow:visible;flex:none}
 .tbar{overflow-x:auto;max-width:calc(100% - 72px);scrollbar-width:none}
 .prof{position:static;box-shadow:none;background:var(--tint);padding:6px 10px 8px}
 .cv-wrap{height:140px}
 .lpop{max-height:calc(100% - 80px)}
 .user .nm{display:none}.user{padding:3px}
 .maplibregl-ctrl-bottom-right{bottom:20px}
 .toast{top:64px}
 .help{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.garmin,.tb,.ev,.cmd,.sbtn{transition:background .12s,filter .12s}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="side" id="side">
 <div class="head">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18l5-9 4 6 3-4 6 7z"/></svg>Na Carta</div>
  <button class="user" id="user" aria-label="Аккаунт: Алекс П., синхронизировано" data-tip="Алекс П. · синхронизировано"><span class="ava">АП</span><i class="sdot"></i></button>
 </div>
 <input class="title" id="title" value="Синтра – Колареш, круг" aria-label="Название маршрута" spellcheck="false">
 <div class="seg" role="radiogroup" aria-label="Тип маршрута" id="kind">
  <label><input type="radio" name="kind" value="road"><span>Шоссе</span></label>
  <label><input type="radio" name="kind" value="gravel" checked><span>Гравел</span></label>
  <label><input type="radio" name="kind" value="mtb"><span>МТБ</span></label>
  <label><input type="radio" name="kind" value="foot"><span>Пешком</span></label>
 </div>
 <section class="sum" aria-label="Сводка">
  <div class="row1"><div class="big"><span id="sKm">42,3</span><small>км</small></div><div class="st"><em>≈</em><span id="sT"></span></div></div>
  <div class="row2"><div class="st"><em>↑</em><span id="sUp"></span></div><div class="st"><em>↓</em><span id="sDn"></span></div></div>
  <div class="cov" id="cov" role="img"></div>
  <div class="covl" id="covl"></div>
 </section>
 <div id="profSlot"></div>
 <div class="fold" id="fSet"><button class="fh" aria-expanded="false"><span class="fl">Настройки</span><span class="fs" id="setSum"></span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="fb">
   <div class="lbl">Покрытие</div>
   <div class="seg three" role="radiogroup" aria-label="Покрытие" id="surf"><label><input type="radio" name="surf" value="Асфальт"><span>Асфальт</span></label><label><input type="radio" name="surf" value="любое" checked><span>Любое</span></label><label><input type="radio" name="surf" value="Грунт"><span>Грунт</span></label></div>
   <div class="lbl">Подъёмы</div>

(function(){

for(let i=0;i<P.length-1;i++)for(let s=0;s<40;s++)dense.push(cr(P[Math.max(0,i-1)],P[i],P[i+1],P[Math.min(P.length-1,i+2)],s/40));

 for(let s=1;s<N-1;s++){if(segs[s].surf!==segs[s-1].surf&&segs[s].surf!=='asphalt'){let e=s;while(e+1<N-1&&segs[e+1].surf===segs[s].surf)e++;const sf=segs[s].surf,len=pts[e+1].d-pts[s].d;L.push({k:'surf',km:pts[s].d,km2:pts[e+1].d,t:(sf==='straight'?'По прямой, ':SURF[sf].n+', ')+fmt(len)+' км',sf,p:sf==='straight'?2:sf==='compact'?4:3});}}

 L.sort((a,b)=>a.km-b.km||a.p-b.p);
 while(L.length>10){let mx=-1,ix=-1;L.forEach((e,n)=>{if(e.p>mx){mx=e.p;ix=n;}});if(mx<2)break;L.splice(ix,1);}
 L.forEach((e,n)=>{const nx=L[n+1];if(nx){const a=at(e.km),b=at(nx.km),m=at((e.km+nx.km)/2);e.g=(b.ele-a.ele)/((nx.km-e.km)*10);e.gc=gcls((b.ele-a.ele)/((nx.km-e.km)*1000)*100);e.sf=m.seg.surf;}else{e.gc=null;}});

 }).join('');

function applyTheme(){if(!map||!map.getLayer('b-osm'))return;const d=dark();map.getStyle().layers.forEach(l=>{if(l.type==='raster'&&l.id.startsWith('b-')){map.setPaintProperty(l.id,'raster-brightness-max',d?.72:1);map.setPaintProperty(l.id,'raster-saturation',d?-.25:0);}});map.setPaintProperty('bg','background-color',d?'#2a2d30':'#e8e6e1');}
function drawMarkers(){
 markers.forEach(m=>m.remove());markers=[];
 const mk=(el,p)=>markers.push(new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).addTo(map));
 [[0,'start'],[N-1,'end']].forEach(([i,t])=>{const e=document.createElement('div');e.className='nk-wp nk-wp-'+t;e.title=t==='start'?'Старт':'Финиш';mk(e,pts[i]);});
 [22,41].forEach((o,n)=>{const e=document.createElement('div');e.className='nk-wp nk-wp-mid';e.textContent=n+1;e.title='Точка '+(n+1);mk(e,pts[ri(o)]);});
 st.cps.forEach((c,n)=>{const e=document.createElement('div');e.className='nk-cp';e.title=c.n;e.dataset.cp=n;e.innerHTML=svgI(c.k,16);e.addEventListener('click',ev=>{ev.stopPropagation();const idx=evs.findIndex(x=>x.cp===n);if(idx>=0)selectEvent(idx);});mk(e,pts[ri(c.i)]);});
}
function refreshRoute(){if(!map||!map.getSource('route'))return;map.getSource('route').setData(routeData());drawMarkers();}
function profPad(){const h=document.body.clientWidth>=640?$('#prof').offsetHeight+12:0;$('#mapcol').style.setProperty('--prof-h',h+'px');if(map)map.setPadding({top:64,bottom:h,left:0,right:0});}
function fit(){const b=new maplibregl.LngLatBounds();pts.forEach(p=>b.extend([p.lon,p.lat]));map.fitBounds(b,{padding:{top:70,bottom:40,left:50,right:60},duration:500,maxZoom:14});}
function initMap(){
 map=new maplibregl.Map({container:'map',style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#e8e6e1'}}]},center:[-9.41,38.815],zoom:12,attributionControl:false});
 window.__map=map;
 map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
 map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
 map.on('load',()=>{
  const bases=[];GROUPS.forEach(g=>g.items.forEach(it=>bases.push(it)));
  bases.forEach(([id,n,tiles])=>map.addSource('b-'+id,{type:'raster',tiles,tileSize:256,maxzoom:19,attribution:id==='osm'?'© участники OpenStreetMap':''}));
  OVERLAYS.forEach(([id,n,tiles])=>map.addSource('o-'+id,{type:'raster',tiles,tileSize:256,maxzoom:18}));
  bases.forEach(([id])=>map.addLayer({id:'b-'+id,type:'raster',source:'b-'+id,layout:{visibility:id===curBase?'visible':'none'}}));
  OVERLAYS.forEach(([id,n,t,op])=>map.addLayer({id:'o-'+id,type:'raster',source:'o-'+id,layout:{visibility:'none'},paint:{'raster-opacity':op}}));
  map.addSource('route',{type:'geojson',data:routeData()});
  map.addLayer({id:'r-casing',type:'line',source:'route',filter:['!=',['get','s'],'straight'],layout:{'line-join':'round'},paint:{'line-color':'#1b2430','line-width':9,'line-opacity':.9}});
  map.addLayer({id:'r-halo',type:'line',source:'route',filter:['==',['get','s'],'straight'],paint:{'line-color':'#fff','line-width':6,'line-opacity':.85}});
  const ce=['match',['get','g'],0,GC[0],1,GC[1],2,GC[2],3,GC[3],4,GC[4],5,GC[5],6,GC[6],'#999'];
  ['asphalt','compact','gravel','dirt','trail'].forEach(s=>{const paint={'line-color':ce,'line-width':5};if(SURF[s].dash)paint['line-dasharray']=SURF[s].dash;map.addLayer({id:'r-'+s,type:'line',source:'route',filter:['==',['get','s'],s],layout:{'line-join':'round'},paint});});
  map.addLayer({id:'r-straight',type:'line',source:'route',filter:['==',['get','s'],'straight'],paint:{'line-color':'#6b7280','line-width':3,'line-dasharray':[2,2]}});
  map.addLayer({id:'r-steep',type:'line',source:'route',filter:['==',['get','steep'],1],paint:{'line-color':'#fff','line-width':1.6,'line-dasharray':[1,2],'line-opacity':.95}});
  hoverEl=document.createElement('div');hoverEl.className='nk-hover';hoverEl.style.display='none';hoverMk=new maplibregl.Marker({element:hoverEl}).setLngLat([pts[0].lon,pts[0].lat]).addTo(map);
  applyTheme();drawMarkers();profPad();
 });
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();prof.draw();});
 // map hover -> profile
 const samples=[];
 map.on('mousemove',e=>{
  if(!map.getLayer('r-asphalt'))return;
  let best=1e9,bk=null;
  for(let k=0;k<=KM;k+=.15){const a=at(k),p=map.project([a.lon,a.lat]);const d=Math.hypot(p.x-e.point.x,p.y-e.point.y);if(d<best){best=d;bk=k;}}
  if(best<22){map.getCanvas().style.cursor='pointer';focusKm(bk,'map');}else{map.getCanvas().style.cursor=editOn?'crosshair':'';if(hoverKm!=null&&hoverSrc==='map')clearFocus();}
 });
 map.on('mouseout',()=>{if(hoverSrc==='map')clearFocus();});
 map.on('click',e=>{if(!editOn)return;toast(straightOn?'Прямой отрезок: точка добавлена':'Точка добавлена, маршрут пересчитан');dirty();});
}
let hoverSrc=null;
function focusKm(km,src){
 hoverKm=km;hoverSrc=src;
 const a=at(km);hoverEl.style.display='block';hoverMk.setLngLat([a.lon,a.lat]);
 prof.show(km,src==='prof');setRow(km,false);
}
function clearFocus(){
 hoverKm=null;hoverSrc=null;
 if(pinKm!=null){const a=at(pinKm);hoverMk.setLngLat([a.lon,a.lat]);}else hoverEl.style.display='none';
 prof.hide();setRow(null);
}
function selectEvent(n){
 const e=evs[n];pinKm=e.km;
 document.querySelectorAll('.ev').forEach((r,i)=>r.classList.toggle('pin',i===n));
 document.querySelectorAll('.nk-cp').forEach(c=>c.classList.toggle('sel',e.cp!=null&&+c.dataset.cp===e.cp));
 const a=at(e.km);hoverEl.style.display='block';hoverMk.setLngLat([a.lon,a.lat]);
 if(e.km2){const b=new maplibregl.LngLatBounds();for(let k=e.km;k<=e.km2;k+=.3){const q=at(k);b.extend([q.lon,q.lat]);}b.extend([at(e.km2).lon,at(e.km2).lat]);map.fitBounds(b,{padding:{top:90,bottom:50,left:80,right:80},maxZoom:14.5,duration:600});}
 else map.easeTo({center:[a.lon,a.lat],zoom:Math.max(map.getZoom(),13.5),duration:600});
 prof.pin(e.km,e.km2);
}
function unpin(){pinKm=null;document.querySelectorAll('.ev.pin').forEach(r=>r.classList.remove('pin'));document.querySelectorAll('.nk-cp.sel').forEach(c=>c.classList.remove('sel'));if(hoverKm==null)hoverEl.style.display='none';prof.pin(null);}
/* ---- profile ---- */
const prof=(function(){
 const cv=$('#cv'),ctx=cv.getContext('2d'),tip=$('#tip');let band=null,pk=null,hk=null,geo=null;
 const icons={};Object.keys(ICP).forEach(k=>icons[k]=new Path2D(ICP[k]));
 const css=n=>getComputedStyle(cv).getPropertyValue(n).trim()||'#222';
 const pat=document.createElement('canvas');pat.width=pat.height=8;{const c=pat.getContext('2d');c.strokeStyle='rgba(20,20,20,.6)';c.lineWidth=1.6;c.beginPath();c.moveTo(-1,9);c.lineTo(9,-1);c.moveTo(-1,5);c.lineTo(5,-1);c.moveTo(3,9);c.lineTo(9,3);c.stroke();}
 function draw(){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const ink=css('--ink'),muted=css('--soft'),grid=css('--line'),paper=css('--paper');
  const narrow=w<500,L=narrow?34:44,R=10,Tp=26,B=36,pw=w-L-R,ph=h-Tp-B;
  const eles=pts.map(p=>p.ele),mn=Math.min(...eles),mx=Math.max(...eles);
  const lo=Math.floor((mn-15)/50)*50,hi=Math.ceil((mx+25)/50)*50,X=k=>L+k/KM*pw,Y=e=>Tp+ph*(1-(e-lo)/(hi-lo));
  ctx.font='11px "JetBrains Mono",monospace';ctx.textBaseline='middle';
  const step=(hi-lo)>300?100:50;
  for(let e=lo;e<=hi;e+=step){const y=Y(e);ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillStyle=muted;ctx.textAlign='right';ctx.fillText(e+(narrow?'':' м'),L-5,y);}
  if(band){ctx.fillStyle='rgba(255,216,61,.45)';ctx.fillRect(X(band[0]),Tp-4,Math.max(3,X(band[1])-X(band[0])),ph+8);}
  segs.forEach(s=>{const a=pts[s.i],b=pts[s.i+1];ctx.fillStyle=GC[s.gc];ctx.beginPath();ctx.moveTo(X(a.d)-.4,Y(a.ele));ctx.lineTo(X(b.d)+.4,Y(b.ele));ctx.lineTo(X(b.d)+.4,Tp+ph);ctx.lineTo(X(a.d)-.4,Tp+ph);ctx.closePath();ctx.fill();});
  // steeper than limit: hatch
  const hp=ctx.createPattern(pat,'repeat');
  segs.forEach(s=>{if(Math.abs(s.g)>limit){const a=pts[s.i],b=pts[s.i+1];ctx.fillStyle=hp;ctx.beginPath();ctx.moveTo(X(a.d)-.4,Y(a.ele));ctx.lineTo(X(b.d)+.4,Y(b.ele));ctx.lineTo(X(b.d)+.4,Tp+ph);ctx.lineTo(X(a.d)-.4,Tp+ph);ctx.closePath();ctx.fill();}});
  ctx.strokeStyle=ink;ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>{i?ctx.lineTo(X(p.d),Y(p.ele)):ctx.moveTo(X(p.d),Y(p.ele));});ctx.stroke();
  // surface strip
  const sy=Tp+ph+10;let i0=0;ctx.lineCap='butt';
  for(let i=1;i<=segs.length;i++){if(i===segs.length||segs[i].surf!==segs[i0].surf){const k=segs[i0].surf,sf=SURF[k];ctx.strokeStyle=k==='straight'?'#6b7280':ink;ctx.lineWidth=5;ctx.setLineDash(sf.dash?sf.dash.map(v=>v*5):[]);ctx.beginPath();ctx.moveTo(X(pts[i0].d),sy);ctx.lineTo(X(pts[i].d),sy);ctx.stroke();ctx.setLineDash([]);i0=i;}}
  ctx.fillStyle=muted;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(let k=0;k<=KM;k+=narrow?10:5)ctx.fillText(k+(k===0?' км':''),X(k),h-4);
  // checkpoints
  st.cps.forEach(c=>{const p=pts[ri(c.i)],x=X(p.d);ctx.strokeStyle=muted;ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(x,Y(p.ele));ctx.lineTo(x,13);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.strokeStyle=ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,11,10,0,7);ctx.fill();ctx.stroke();ctx.save();ctx.translate(x-7,4);ctx.scale(14/24,14/24);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.stroke(icons[c.k]);ctx.restore();});
  const cur=hk!=null?hk:pk;
  if(cur!=null){const r=at(cur),x=X(r.km);ctx.strokeStyle=ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,Tp);ctx.lineTo(x,Tp+ph+14);ctx.stroke();ctx.fillStyle='#ffd83d';ctx.strokeStyle='#141414';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,Y(r.ele),5.5,0,7);ctx.fill();ctx.stroke();}
  geo={L,R,pw,w};
 }
 function tipFor(km){const a=at(km),g=a.seg.g;tip.hidden=false;tip.innerHTML='<b>'+fmt(km)+' км</b><span class="m">'+Math.round(a.ele)+' м</span><span class="m">'+(g>=0?'↑ ':'↓ ')+fmt(Math.abs(g)).replace('−','')+'%</span><span>'+SURF[a.seg.surf].n+'</span>';const tw=tip.offsetWidth,px=geo.L+km/KM*geo.pw;tip.style.left=Math.max(4,Math.min(geo.w-tw-4,px-tw/2))+'px';}
 function show(km,own){hk=km;if(geo)tipFor(km);draw();}
 function hide(){hk=null;tip.hidden=true;draw();}
 function pin(km,km2){pk=km;band=km!=null&&km2?[km,km2]:null;if(km!=null&&geo)tipFor(km);else if(hk==null)tip.hidden=true;draw();}
 function kmFromX(cx){const r=cv.getBoundingClientRect();return Math.max(0,Math.min(KM,(cx-r.left-geo.L)/geo.pw*KM));}
 cv.addEventListener('pointermove',e=>focusKm(kmFromX(e.clientX),'prof'));
 cv.addEventListener('pointerdown',e=>focusKm(kmFromX(e.clientX),'prof'));
 cv.addEventListener('pointerleave',()=>clearFocus());
 cv.addEventListener('click',e=>{const k=kmFromX(e.clientX),a=at(k);map.easeTo({center:[a.lon,a.lat],duration:400});});
 if(window.ResizeObserver)new ResizeObserver(draw).observe(cv);
 return {draw,show,hide,pin,band:b=>{band=b;draw();}};
})();
function renderLegend(){
 $('#leg').innerHTML=GC.map((c,i)=>'<span class="lg"><i style="background:'+c+(i===2?';box-shadow:inset 0 0 0 1.5px '+OUT:'')+'"></i>'+GL[i]+'</span>').join('')+'<span class="sp"></span>'+SORDER.map(k=>{const d=SURF[k].dash,da=d?' stroke-dasharray="'+d.map(v=>v*3.5).join(' ')+'"':'';return '<span class="lg"><svg width="24" height="8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="'+(k==='straight'?'#6b7280':'currentColor')+'" stroke-width="3"'+da+'/></svg>'+SURF[k].n+'</span>';}).join('')+'<span class="lg"><svg width="14" height="12" aria-hidden="true"><rect width="14" height="12" rx="2" fill="#e4e2dc"/><path d="M-1 8L8-1M-1 13L13-1M5 13L15 3" stroke="#141414" stroke-opacity=".6" stroke-width="1.4"/></svg>круче лимита</span>';
}

};
function pushHist(label){hist.push({s:JSON.stringify(st),label});fut=[];if(hist.length>50)hist.shift();updHist();}
function updHist(){$('#b-undo').setAttribute('aria-disabled',hist.length?'false':'true');$('#b-redo').setAttribute('aria-disabled',fut.length?'false':'true');}
function applyState(){compute();buildEvents();renderEvents();renderSummary();refreshRoute();prof.draw();pinKm=null;}
function undo(){if(!hist.length)return toast('Нечего отменять');const h=hist.pop();fut.push({s:JSON.stringify(st),label:h.label});st=JSON.parse(h.s);applyState();updHist();toast('Отменено: '+h.label);dirty();}
function redo(){if(!fut.length)return toast('Нечего повторять');const h=fut.pop();hist.push({s:JSON.stringify(st),label:h.label});st=JSON.parse(h.s);applyState();updHist();toast('Повторено: '+h.label);dirty();}
function reverse(){pushHist('разворот маршрута');st.rev=!st.rev;applyState();toast('Маршрут развёрнут');dirty();}
function addCp(){
 let km=pinKm!=null?pinKm:hoverKm;
 if(km==null){const c=map.getCenter();let best=1e9;for(let k=0;k<=KM;k+=.2){const a=at(k),d=Math.hypot(a.lat-c.lat,a.lon-c.lng);if(d<best){best=d;km=k;}}}
 const idx=Math.round(km/KM*(N-1)),orig=ri(idx);
 pushHist('чекпоинт');st.cps.push({i:orig,k:'flag',n:'Чекпоинт '+(st.cps.length-2)});applyState();toast('Чекпоинт на '+fmt(km)+' км');dirty();
}
function setEdit(){editOn=!editOn;$('#b-edit').setAttribute('aria-pressed',editOn);if(map)map.getCanvas().style.cursor=editOn?'crosshair':'';toast(editOn?'Правка включена: клик по карте добавляет точку':'Правка выключена');}
function setStraight(){straightOn=!straightOn;$('#b-straight').setAttribute('aria-pressed',straightOn);toast(straightOn?'Следующий отрезок пойдёт по прямой':'Отрезки снова строятся по дорогам');}

function renderPal(){const q=$('#q').value.trim().toLowerCase();palList=CMDS.filter(c=>!q||c.n.toLowerCase().includes(q)||c.keys.join('').toLowerCase()===q.replace(/\s/g,''));palSel=Math.min(palSel,Math.max(0,palList.length-1));$('#cmds').innerHTML=palList.map((c,i)=>'<button class="cmd" role="option" data-i="'+i+'" aria-selected="'+(i===palSel)+'"><span>'+c.n+'</span><span class="ks">'+kbds(c.keys)+'</span></button>').join('')||'<p style="padding:12px;color:var(--soft)">Ничего не найдено</p>';}
$('#q').addEventListener('input',()=>{palSel=0;renderPal();});
$('#q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){palSel=Math.min(palList.length-1,palSel+1);renderPal();e.preventDefault();}else if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);renderPal();e.preventDefault();}else if(e.key==='Enter'){const c=palList[palSel];if(c){closeOv();c.run();}}});
$('#cmds').addEventListener('click',e=>{const b=e.target.closest('.cmd');if(b){const c=palList[+b.dataset.i];closeOv();c.run();}});
$('#cmds').addEventListener('pointermove',e=>{const b=e.target.closest('.cmd');if(b&&+b.dataset.i!==palSel){palSel=+b.dataset.i;renderPal();}});
['Pal','Help'].forEach(n=>$('#ov'+n).addEventListener('pointerdown',e=>{if(e.target.id==='ov'+n)closeOv();}));
$('#helpG').innerHTML=CMDS.filter(c=>c.keys.length).map(c=>'<div><span>'+c.n+'</span><span class="ks">'+kbds(c.keys)+'</span></div>').join('');
/* keys */
const CODE={KeyE:setEdit,KeyZ:null,KeyR:reverse,KeyL:()=>layers(),KeyC:addCp,KeyS:setStraight,KeyF:fit};
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(e.key==='Escape'){if(!$('#ovPal').hidden||!$('#ovHelp').hidden){closeOv();return;}if(!$('#lpop').hidden){layers(false);$('#b-layers').focus();return;}if(pinKm!=null){unpin();return;}}
 if((e.ctrlKey||e.metaKey)&&e.code==='KeyK'){e.preventDefault();openOv('Pal');return;}
 if(t.matches&&t.matches('input[type=text],input:not([type]),textarea,select,[contenteditable]'))return;
 if(!$('#ovPal').hidden||!$('#ovHelp').hidden)return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='?'||(e.code==='Slash'&&e.shiftKey)){e.preventDefault();openOv('Help');return;}
 if(e.code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(e.shiftKey)return;
 const f=CODE[e.code];if(f){e.preventDefault();f();}
});
/* panel wiring */
document.querySelectorAll('.fold>.fh').forEach(b=>b.addEventListener('click',()=>{const f=b.parentElement,o=!f.classList.contains('open');f.classList.toggle('open',o);b.setAttribute('aria-expanded',o);}));
function setSum(){const s=document.querySelector('input[name=surf]:checked').value,c=document.querySelector('input[name=climb]:checked').value;$('#setSum').textContent=s.toLowerCase()+' · '+c+' · до '+limit+'%';}
document.querySelectorAll('input[name=surf],input[name=climb]').forEach(i=>i.addEventListener('change',()=>{setSum();dirty();}));
document.querySelectorAll('input[name=kind]').forEach(i=>i.addEventListener('change',()=>{kind=i.value;renderSummary();dirty();toast('Тип: '+i.nextElementSibling.textContent.toLowerCase());}));
$('#steep').addEventListener('input',e=>{limit=+e.target.value;$('#steepv').textContent=limit+'%';setSum();renderSummary();if(map&&map.getSource('route'))map.getSource('route').setData(routeData());prof.draw();});
$('#title').addEventListener('change',dirty);
$('#user').addEventListener('click',()=>{dirty();});
$('#evs').addEventListener('click',e=>{const b=e.target.closest('.ev');if(!b)return;const n=+b.dataset.n;if(b.classList.contains('pin')){unpin();return;}selectEvent(n);});
$('#evs').addEventListener('pointerover',e=>{const b=e.target.closest('.ev');if(!b)return;const ev=evs[+b.dataset.n];hoverKm=ev.km;hoverSrc='ev';const a=at(ev.km);hoverEl.style.display='block';hoverMk.setLngLat([a.lon,a.lat]);prof.show(ev.km);prof.band(ev.km2?[ev.km,ev.km2]:null);});
$('#evs').addEventListener('pointerleave',()=>{prof.band(null);if(pinKm!=null){prof.pin(pinKm,evs.find(x=>x.km===pinKm&&x.km2)?evs.find(x=>x.km===pinKm).km2:null);}hoverKm=null;hoverSrc=null;if(pinKm!=null){prof.hide();const a=at(pinKm);hoverMk.setLngLat([a.lon,a.lat]);}else{hoverEl.style.display='none';prof.hide();}});
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;a==='share'?share():toast((a==='gpx'?'GPX':'FIT')+' сохранён');}));
$('#garmin').addEventListener('click',garmin);
$('#pcol').addEventListener('click',()=>{const p=$('#prof'),s=!p.classList.contains('shut');p.classList.toggle('shut',s);$('#pcol').setAttribute('aria-expanded',!s);$('#pcol').setAttribute('aria-label',s?'Развернуть профиль':'Свернуть профиль');$('#pcol').dataset.tip=s?'Развернуть профиль':'Свернуть профиль';profPad();prof.draw();});
$('#my').innerHTML=[['#141414','Синтра – Колареш, круг','42,3 км · сегодня, 09:12',1],['#c2410c','Серра-да-Аррабида, гравел','58,7 км · 3 ноя',0],['#7c3aed','Кабу-да-Рока и обратно','31,0 км · 27 окт',0],['#2563eb','Пеня – Мафра, трек GPS','24,8 км · 19 окт',0]].map(r=>'<li class="item"><i class="dot" style="background:'+r[0]+'"></i><span><b>'+r[1]+'</b><small>'+r[2]+'</small></span><button class="eye" aria-pressed="'+!!r[3]+'" aria-label="Показать на карте"><svg class="on-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.2A10 10 0 0 1 12 5c6.2 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.3 2 12 2 12s3.8 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></li>').join('');
$('#my').addEventListener('click',e=>{const b=e.target.closest('.eye');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');});
/* mobile: profile moves into the sheet */
const mq=matchMedia('(max-width:639px)');
function place(){const p=$('#prof');if(mq.matches)$('#profSlot').appendChild(p);else $('#mapcol').appendChild(p);$('#profSlot').style.display=mq.matches?'block':'none';profPad();prof.draw();}
mq.addEventListener('change',place);
/* init */
compute();buildEvents();renderEvents();renderSummary();renderLegend();setSum();updHist();
initMap();place();
if(window.ResizeObserver)new ResizeObserver(profPad).observe($('#prof'));
map.getCanvas().style.cursor='crosshair';
window.addEventListener('resize',profPad);
})();
</script>
</body>
